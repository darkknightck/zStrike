<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0d10" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Counter-Strike 1.6 · LAN</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="desktop">
      <div class="backdrop" aria-hidden="true"></div>

      <section class="card" aria-labelledby="title">
        <header class="brand">
          <img src="/apple-touch-icon.png" alt="" width="44" height="44" />
          <div>
            <h1 id="title">Counter-Strike <span>1.6</span></h1>
            <p class="tagline">Chơi ngay trên trình duyệt · mạng LAN</p>
          </div>
        </header>

        <form id="join-form" class="join" autocomplete="off">
          <label for="player-name-input">Tên người chơi</label>
          <div class="row">
            <input
              id="player-name-input"
              type="text"
              maxlength="24"
              placeholder="Nhập tên của bạn"
              autofocus
            />
            <button id="play-button" type="submit" disabled>Chơi</button>
          </div>
        </form>

        <div class="loader" aria-live="polite">
          <div class="bar"><div id="progress-fill"></div></div>
          <progress id="progress-bar" value="0" max="100" hidden></progress>
          <div class="loader-text">
            <span id="loading-status">Đang khởi động…</span>
            <span id="loading-detail"></span>
          </div>
        </div>

        <label class="toggle">
          <input id="hd-toggle" type="checkbox" />
          <span class="switch" aria-hidden="true"></span>
          <span class="toggle-text">
            <strong>Đồ hoạ HD</strong>
            <small>Súng HD, bầu trời HD, chi tiết tường/sàn · tải thêm ~85 MB, máy yếu nên tắt</small>
          </span>
        </label>

        <footer class="hints">
          <span><kbd>Esc</kbd> menu</span>
          <span><kbd>`</kbd> console</span>
          <span><kbd>B</kbd> mua súng</span>
          <span><kbd>Tab</kbd> bảng điểm</span>
        </footer>
      </section>
    </main>
    <canvas id="canvas"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
