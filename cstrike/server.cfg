hostname "CS 1.6 LAN Party"
sv_lan 0
public 0
mp_friendlyfire 1
mp_timelimit 30
mp_autoteambalance 1

// --- full arsenal for everyone ---
// Max money every round so anyone can buy the whole arsenal in the buyzone.
mp_startmoney 16000
mp_buytime 9

// RCON — used by the in-browser map picker (web/index.html) to changelevel.
// Public on purpose: on a LAN anyone is allowed to switch the map.
rcon_password "cs16lan"

// Tắt kiểm tra file model: bản web kẹt ở bước này với model tuỳ chỉnh (Angelina),
// bản server giả lập 32-bit thì crash khi model khác server. Mọi người vẫn tải cùng model.
mp_consistency 0

// Log sự kiện (giết, vào đội, điểm đội) ra cstrike/logs: container score đọc để vẽ bảng điểm.
// Không có thư mục logs (CLIENT=old) thì server chỉ báo "Logging disabled", không ảnh hưởng.
log on
